# mlghtml.toml

[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlght-ml"
version = "0.1.0"
authors = [
  { name="Matteo Zambra" },
]
description = "And End-to-end Machine Learning Orchestration Tool."
requires-python = "~=3.12"

dependencies = [
  "joblib~=1.5",
  "numpy~=2.3",
  "pandas~=2.3",
  "scikit-learn~=1.7",
  "scipy~=1.16",
  "skorch~=1.2",
  "tabulate~=0.9",
  "tqdm~=4.67"
]


